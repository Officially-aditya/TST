name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            system: Linux
            machine: x86_64
            binary: tst_memory/target/release/server
          - name: Linux arm64
            os: ubuntu-24.04-arm
            system: Linux
            machine: arm64
            binary: tst_memory/target/release/server
          - name: macOS x86_64
            os: macos-13
            system: Darwin
            machine: x86_64
            binary: tst_memory/target/release/server
          - name: macOS arm64
            os: macos-14
            system: Darwin
            machine: arm64
            binary: tst_memory/target/release/server
          - name: Windows x86_64
            os: windows-latest
            system: Windows
            machine: x86_64
            binary: tst_memory/target/release/server.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build wheel
      - name: Build Rust kernel
        run: cargo build --locked --release --bin server --manifest-path tst_memory/Cargo.toml
      - name: Stage Rust kernel in package
        run: python scripts/stage_kernel.py --binary "${{ matrix.binary }}" --system "${{ matrix.system }}" --machine "${{ matrix.machine }}"
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.system }}-${{ matrix.machine }}
          path: dist/*.whl

  source:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build wheel
      - name: Build source distribution
        run: python -m build --sdist --no-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, source]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
